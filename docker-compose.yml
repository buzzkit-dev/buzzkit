services:
  postgres:
    image: postgres:17-alpine
    container_name: buzzkit-postgres
    ports:
      - '5460:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buzzkit
    volumes:
      - buzzkit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d buzzkit']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  buzzkit-postgres-data:
