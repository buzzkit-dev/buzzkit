name: Agentic audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Domain to audit
        default: buzzkit.dev
        required: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      TARGET: ${{ inputs.target || 'buzzkit.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is Agentic report
        run: |
          scanned() { node -p "JSON.parse(require('fs').readFileSync('$1','utf8')).scanned_at"; }
          npx --yes is-agentic "$TARGET" --json > is-agentic.json
          before=$(scanned is-agentic.json)
          curl -sS -o /dev/null "https://is-agentic.com/scan/$TARGET" || true
          for _ in $(seq 1 20); do
            sleep 30
            npx --yes is-agentic "$TARGET" --json > fresh.json || continue
            if [ "$(scanned fresh.json)" != "$before" ]; then
              mv fresh.json is-agentic.json
              break
            fi
          done
          rm -f fresh.json
      - name: Ratchet the score
        run: node .github/scripts/agentic-ratchet.mjs
      - name: Raise the baseline
        run: |
          git diff --quiet -- .github/agentic-baseline.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/agentic-baseline.json
          git commit -m "chore: raise the agentic baseline"
          git push
      - name: Ora audit
        if: always()
        run: npx --yes ax audit "https://$TARGET" --json > ora.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentic-audit-${{ github.run_id }}
          path: |
            is-agentic.json
            ora.json
