name: Deploy

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/web/**
      - apps/marketing/**
      - packages/**
      - bun.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      cloudflare: ${{ steps.secrets.outputs.cloudflare }}
      dispatch: ${{ steps.secrets.outputs.dispatch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun check-types
      - run: bun run test -- --filter=!@buzzkit/marketing
      - id: secrets
        env:
          CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          DISPATCH: ${{ secrets.E2E_DISPATCH_TOKEN != '' }}
        run: |
          echo "cloudflare=$CLOUDFLARE" >> "$GITHUB_OUTPUT"
          echo "dispatch=$DISPATCH" >> "$GITHUB_OUTPUT"

  production:
    needs: verify
    if: needs.verify.outputs.cloudflare == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Migrate the database
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun db:migrate
        working-directory: packages/database
      - name: Deploy the Tinybird project
        if: env.TINYBIRD_TOKEN != ''
        env:
          TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
          TINYBIRD_URL: https://api.us-east.aws.tinybird.co
        run: bun run deploy
        working-directory: packages/tinybird
      - run: bun run types:emit
        working-directory: apps/api
      - name: Deploy the API
        run: bun run deploy
        working-directory: apps/api
      - name: Deploy the dashboard
        run: bun run deploy
        working-directory: apps/web
      - name: Deploy the marketing site
        run: bun run deploy
        working-directory: apps/marketing

  device-suite:
    needs: [verify, production]
    if: needs.verify.outputs.dispatch == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
      GH_REPO: buzzkit-dev/buzzkit-ios
    steps:
      - name: Run the device suite in buzzkit-ios against what was just deployed
        run: |
          reason="api ${GITHUB_SHA::7}"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run e2e.yml --ref main -f reason="$reason" -f sdk_ref=main

          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id="$(gh run list --workflow e2e.yml --json databaseId,displayTitle,createdAt \
              --jq ".[] | select(.displayTitle | contains(\"$reason\")) | select(.createdAt >= \"$started\") | .databaseId" | head -n 1)"
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "The dispatched e2e run never appeared"; exit 1; }

          echo "Watching https://github.com/$GH_REPO/actions/runs/$run_id"
          gh run watch "$run_id" --exit-status --interval 30

  rollback:
    needs: [production, device-suite]
    if: always() && needs.production.result == 'success' && needs.device-suite.result == 'failure'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Roll the API back to the previous deployment
        run: bunx wrangler rollback --yes --message "device suite failed on ${GITHUB_SHA::7}"
        working-directory: apps/api
      - name: Leave the run red so the regression is visible
        run: |
          echo "::error::The device suite failed against ${GITHUB_SHA::7}; the API was rolled back. The dashboard and marketing site were not."
          exit 1
